services:
  redis:
    image: 'redislabs/rejson:2.0.0'
    ports:
      # Published on a non-default host port to avoid clashing with
      # other projects' Redis containers on 6379. Server/client reach
      # this container on the internal docker network at redis:6379
      # regardless — only host-side tools (e.g. redis-cli) need 6380.
      - '6380:6379'
    volumes:
      - 'redisdata:/data'

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env
    environment:
      # Overrides server/.env so the server reaches Redis by its
      # service name and internal port on the docker network,
      # instead of the host-published localhost:6380.
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3000:3000'
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
    depends_on:
      - redis

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    env_file:
      - client/.env
    ports:
      - '8080:8080'
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    depends_on:
      - server

volumes:
  redisdata:
  server_node_modules:
  client_node_modules:
